<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buoi 2 bai 1</title>
<style>
    body{font-family: Arial,sans-serif;background: #fafafa;margin: 0;padding: 24px;}
    form{max-width: 480px;margin: 0 auto;background: #fff;padding: 20px 24px;border-radius: 8px;}
    fieldset{border: 1px solid #ddd ;border-radius: 6px;padding: 16pc 20px;}
    legend{ font-weight: bold;padding: 0 8px;}
    label{font-weight: bold;}
    input,textarea{width: 100%;padding: 8px;margin-top: 4px;box-sizing: border-box;border: 1px solid #ccc;border-radius: 4px;}
    input[type="range"]{padding: 0;}
    p{margin: 14px 0;}
    button{width: 100%;padding: 12px;margin-top: 16px;background-color: #3498db;color: #fff;border: none;border-radius: 6px;font-size: 16px;cursor: pointer;}
    button:hover{font-weight: bold;color: #3498db;}
</style>
</head>
<body>
    <h1 style="text-align: center;"> DANG KI KHOA HOC</h1>
    <!-- Toàn bộ validate dưới đây dùng thuần HTML5 (required, pattern, min/max),
KHÔNG cần 1 dòng JavaScript nào -->
<form action="#" method="post">
    <fieldset>
        <legend>Thong tin dang ki</legend>
        <p>
            <label for="hoten">Ho va ten: <span style="color: red;"></span></label>
        <input type="text" id="hoten" name="hoten" placeholder="Nguyen Duc Thang" required autofocus>

        </p>
        <p>
            <label for="email" id="email">Email: <span style="color: red;"></span></label>
<input type="email" id="email" name="email" 
placeholder="ten@example" required>
        </p>
        <p>
            <label for="phone"> So dien thoai:  <span style="color: red;"></span></label>
        <input type="tel" name="phone" id="phone"
        pattern="[0-9]{10}"  title="Nhap dung 10 so dien thoai"
        placeholder="0912345678" required>
        </p>
        <p>
            <label for="birthday">Ngay Sinh</label>
            <input type="date" id="birthday" name="birthday" max="2026-08-14">
        </p>
        <p>
            <label for="khoahoc">Khoa hoc quan tam :</label>
            <input type="text" id="khoahoc" name="khoahoc" list="khoahoc-list" 
            placeholder="Chon hoac tu nhap ...">
            <datalist id="khoahoc-list">
<option value="HTML5"></option>
<option value="JavaScript co ban"></option>
<option value="Lap trinh PHP"></option>
<option value="Thiet ke UI/UX"></option>
            </datalist>
        </p>
        <p> 
          <label for="soubuoi">Số buổi muốn học mỗi tuần:</label><br>
<input type="range" id="soubuoi" name="soubuoi" min="1" max="7" value="3"
oninput="ketqua.value = soubuoi.value">
<output name="ketqua" for="soubuoi">3</output> buổi/tuần  
        </p>
        <p>
<label for="ngansach">Ngân sách dự kiến (đồng):</label><br>
<input type="range" id="ngansach" name="ngansach" min="500000" max="10000000"
step="500000" value="2000000"
oninput="ketquaNganSach.value = Number(ngansach.value).toLocaleString('vi-VN')">
<output name="ketquaNganSach" for="ngansach">2.000.000</output>đ
</p>
<p>
<label for="ghichu">Ghi chú thêm:</label>
<textarea id="ghichu" name="ghichu" rows="3"

placeholder="Ví dụ: buổi tối trong tuần, cuối tuần..."></textarea>

</p>
    </fieldset>
    <button type="submit">Đăng ký ngay</button>
    
</form>
</body>
</html>
